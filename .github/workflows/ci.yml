name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        env:
          LLM_PROVIDER: stub
          COLLECT_REAL_SOURCES: "false"
          DATABASE_URL: sqlite:///./data/ci.db
        run: pytest
