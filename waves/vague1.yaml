# Data IA - Proof questions, wave 1 (FROZEN)
# Owner: Data IA · Produit. Do not edit: any change = new wave with new hash.
wave: "1"
frozen_at: "2026-11-18T02:22:55+03:00"
timezone: "Asia/Riyadh"
target_question: "Will Saudi real non-oil activities grow by at least 4.5% in 2027, according to GASTAT's first estimate of 2027 annual real GDP?"
excluded_to_wave_1b: [P6, P17]   # thresholds not yet read by Sources
rules:
  type: binary
  forecast_freeze: "frozen and timestamped no later than 48h before expected publication"
  deadline_time: "23:59 Asia/Riyadh on the deadline date"
  void_rule: "if the resolution publication is not out by the deadline, the question is void"
  tie_rule: "strict comparator (>): tie = NO; inclusive (>= / <=): tie = YES; values read at the precision printed"
  previous_point_rule: "comparisons to a previous period use that period as revised in the same publication"
  fixed_threshold_rule: "fixed numeric thresholds are frozen numbers; the previous period is not re-read"
  single_series_rule: "the series below is used for both resolution and naive baseline"
  resolution_sources: "official published documents only (GASTAT, SAMA, OPEC, Riyad Bank, Ministry of Tourism); no SAMA API or internal routes; Argaam/CEIC used only to anchor thresholds"
  naive_baseline_order: ["historical frequency of the event on the same series, last 24-36 observations", "persistence / status quo (expressed as a probability, method set by Modèle)", "0.5 only as last resort with written per-question justification recorded before freeze"]
  scoring: "Brier vs naive baseline, counted in effective questions (n_eff): 30 checkpoint, 50 formal conclusion, target 100"
correlation_groups:
  G_PMI: [P1, P2]
  G_BCI: [P3, P4]
  G_OIL: [P5]
  G_GDP: [P7, P8, P13]
  G_IPI: [P9, P10]
  G_DEMAND_M3_M4_M5: [P1, P2, P3, P4, P11, P12, P14]   # rho [to confirm] by Modèle
