# Aggregation taxonomy for the Starlink KSA seed (ILLUSTRATIVE).
# Formula: root uses weighted_logit over three branches (slide 7 style).

root:
  type: weighted_logit
  children:
    - id: regulatory_track
      weight: 0.45
    - id: commercial_readiness
      weight: 0.30
    - id: geopolitical_fit
      weight: 0.25

regulatory_track:
