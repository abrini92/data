# PROVISIONAL – pending validation by the model owner.
# Maps reliability_prior score in [0, 1] → prior variance for the source model.
# Variance is strictly decreasing in the score (higher reliability → tighter prior).
# Prior bias defaults to 0. These values are NOT calibrated.

status: "PROVISIONAL – pending validation by the model owner"
prior_bias: 0.0
n0: 5.0

# Monotonic table: score ascending, variance descending.
score_to_variance:
  - score: 0.00
    variance: 0.40
  - score: 0.50
    variance: 0.20
  - score: 0.75
    variance: 0.10
  - score: 0.85
    variance: 0.07
  - score: 0.90
    variance: 0.05
  - score: 0.95
    variance: 0.035
  - score: 1.00
    variance: 0.025
