# CONVENTION – PROVISIONAL, not calibrated.
# Normal-inverse-gamma (NIG) prior per source for bias/variance (Pass 3b).
# The NIG Bayesian update itself is Pass 4 — this file is config + loader only.
# sigma2_ref is a placeholder scale; it has NOT been measured on real errors.

status: "CONVENTION – PROVISIONAL, not calibrated"
convention_note: >
  NIG hyperparameters replace the single shrinkage N0 from Pass 3.
  s0² = k(class) · sigma2_ref. Do not present these as calibrated.

# NIG hyperparameters (Murphy NIχ² / NIG form): bias ~ N(b0, σ²/κ0), σ² ~ Inv-χ²(ν0, s0²)
nig:
  b0: 0.0
  kappa0: 2.0
  nu0: 4.0          # must be > 2
  sigma2_ref: 0.10  # NOT YET MEASURED — provisional reference scale

# Class multipliers for s0² = k(class) · sigma2_ref.
# Must be monotone non-decreasing A ≤ B ≤ C ≤ D (loader rejects otherwise).
k_by_class:
  A: 0.5
  B: 1.0
  C: 1.25
  D: 2.0

# Optional score→variance table still used by reliability_prior interpolation
# until Pass 4 wires NIG fully. PROVISIONAL.
prior_bias: 0.0
score_to_variance:
  - score: 0.00
    variance: 0.40
  - score: 0.50
    variance: 0.20
  - score: 0.75
    variance: 0.10
  - score: 0.85
    variance: 0.07
  - score: 0.90
    variance: 0.05
  - score: 0.95
    variance: 0.035
  - score: 1.00
    variance: 0.025
