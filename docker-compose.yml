services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dataia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataia}
      POSTGRES_DB: ${POSTGRES_DB:-dataia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataia} -d ${POSTGRES_DB:-dataia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
