[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ia"
version = "0.1.0"
description = "Data IA – stc internal decision engine (version 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2",
  "apscheduler>=3.10",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.26",
  "streamlit>=1.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]
bayes = [
  "pymc>=5.10",
]

[project.scripts]
data-ia = "data_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "postgres: needs a reachable PostgreSQL (skip on Windows without Docker)",
]
